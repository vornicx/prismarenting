<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>PRISMA form definitions</title></head>
<body>
  <!-- Static blueprint required by Netlify Forms for Next.js/SSR form detection. -->
  <form name="prisma-contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="prisma-contact">
    <input type="text" name="bot-field">
    <input type="text" name="name">
    <input type="tel" name="phone">
    <input type="email" name="email">
    <input type="text" name="promoCode">
    <textarea name="message"></textarea>
    <input type="text" name="sourcePath">
    <input type="text" name="formVariant">
    <input type="checkbox" name="privacy" value="accepted">
  </form>
</body>
</html>
