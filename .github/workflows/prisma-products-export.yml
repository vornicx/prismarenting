name: PRISMA Product Export

on:
  push:
    branches:
      - archic-prisma-full-migration
    paths:
      - "scripts/export_wc_products.py"
      - ".github/workflows/prisma-products-export.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archic-prisma-full-migration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Export WooCommerce products
        run: python scripts/export_wc_products.py
      - run: cat migration-products/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: prisma-product-export
          path: migration-products/
          retention-days: 3
      - name: Persist product export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration-products
          git diff --cached --quiet || git commit -m "data: snapshot PRISMA WooCommerce catalog"
          git pull --rebase origin archic-prisma-full-migration
          git push origin HEAD:archic-prisma-full-migration
