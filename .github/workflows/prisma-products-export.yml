name: PRISMA Product Export

on:
  push:
    branches:
      - archic-prisma-full-migration
    paths:
      - "scripts/export_wc_products.py"
      - ".github/workflows/prisma-products-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Export WooCommerce products
        run: python scripts/export_wc_products.py
      - run: cat migration-products/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: prisma-product-export
          path: migration-products/
          retention-days: 3
