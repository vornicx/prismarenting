name: PRISMA Content Export

on:
  push:
    branches:
      - archic-prisma-full-migration
    paths:
      - "scripts/export_wp_content.py"
      - ".github/workflows/prisma-content-export.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archic-prisma-full-migration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Export WordPress pages and posts
        run: python scripts/export_wp_content.py
      - name: Show content summary
        run: cat migration-content/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: prisma-content-export
          path: migration-content/
          retention-days: 3
      - name: Persist content export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration-content
          git diff --cached --quiet || git commit -m "data: snapshot PRISMA WordPress content"
          git pull --rebase origin archic-prisma-full-migration
          git push origin HEAD:archic-prisma-full-migration
