name: PRISMA Runtime Snapshot

on:
  push:
    branches:
      - archic-prisma-full-migration
    paths:
      - "scripts/build_runtime_snapshot.py"
      - ".github/workflows/prisma-runtime-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archic-prisma-full-migration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build compact runtime snapshot
        run: python scripts/build_runtime_snapshot.py
      - name: Verify runtime snapshot
        run: |
          cat migration-runtime/summary.json
          python - <<'PY'
          import json
          s=json.load(open('migration-runtime/summary.json'))
          assert s['crawl_records'] == 744, s
          assert s['active_woocommerce_paths'] == 125, s
          assert s['runtime_records'] > 200, s
          print('Runtime snapshot verified')
          PY
      - name: Persist runtime snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration-runtime
          git diff --cached --quiet || git commit -m "data: build compact PRISMA runtime snapshot"
          git push origin HEAD:archic-prisma-full-migration
