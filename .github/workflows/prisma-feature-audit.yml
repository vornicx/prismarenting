name: PRISMA Feature Audit

on:
  push:
    branches:
      - archic-prisma-full-migration
    paths:
      - "scripts/audit_source_features.py"
      - ".github/workflows/prisma-feature-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archic-prisma-full-migration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit interactive source content
        run: python scripts/audit_source_features.py
      - name: Persist feature audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration-report/feature-audit.json
          git diff --cached --quiet || git commit -m "data: audit PRISMA interactive content"
          git push origin HEAD:archic-prisma-full-migration
